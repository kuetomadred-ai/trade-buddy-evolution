name: Background Trade Monitor & SL/TP Engine

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: plutus-trade-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger server-side trade monitoring
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.LOVABLE_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 45 \
            -X POST "${APP_URL%/}/api/public/jobs/monitor-trades" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
